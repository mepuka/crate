[project]
name = "faiss-search-api"
version = "1.0.0"
description = "FAISS semantic search API for KEXP music data"
requires-python = ">=3.12"
dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # ML/Search
    "faiss-cpu>=1.12.0",
    "sentence-transformers>=3.3.0",
    "numpy>=2.0.0",
    "rank_bm25>=0.2.2",
    # Pin torch to CPU-only (avoids 2GB+ CUDA downloads)
    "torch>=2.0.0",

    # Utilities
    "psutil>=6.1.0",
    "httpx>=0.27.0",
    "joblib>=1.4.2",
    "orjson>=3.10.7",

    # GCP Pub/Sub for enrichment triggers
    "google-cloud-pubsub>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
