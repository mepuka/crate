[project]
name = "faiss-search-api"
version = "1.0.0"
description = "FAISS semantic search API for KEXP music data"
requires-python = ">=3.12"
dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # ML/Search
    "faiss-cpu>=1.12.0",
    "sentence-transformers>=3.3.0",
    "numpy>=2.0.0",
    "rank_bm25>=0.2.2",
    # Pin torch to CPU-only (avoids 2GB+ CUDA downloads)
    "torch>=2.0.0",

    # Utilities
    "psutil>=6.1.0",
    "httpx>=0.27.0",
    "joblib>=1.4.2",
    "orjson>=3.10.7",

    # GCP Pub/Sub for enrichment triggers
    "google-cloud-pubsub>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "tests",
    "pyproject.toml",
    "README.md",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    "data",
    "mb_dumps",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # FastAPI dependency injection idiom (Depends in function params).
    "B008",
    # HTTPException re-raise style is intentional in route handlers.
    "B904",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^data/",
    "^mb_dumps/",
    "^tests/test_api.py$",
    "^venv/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = [
    # Incremental typing baseline: keep checking the rest of the codebase while
    # we pay down existing legacy type debt in these high-churn modules.
    "app.main",
    "app.kexp_models",
    "app.models.insights",
    "app.services.db_service",
    "app.services.embedding_integration_service",
    "app.services.hybrid_search_service",
    "app.services.search_service",
    "app.services.sync",
]
ignore_errors = true
