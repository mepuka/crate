version: '3.8'

services:
  api:
    build: .
    container_name: kexp-search-api
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    environment:
      - DATABASE_PATH=/app/data/music_kb.sqlite
      - EMBEDDINGS_PATH=/app/data/embeddings_384d.npy
      - PLAY_IDS_PATH=/app/data/play_ids.npy
      - INDEX_PATH=/app/data/embeddings_384d.index
      - METADATA_PATH=/app/data/metadata.json
      - MODEL_NAME=BAAI/bge-small-en-v1.5
      - EMBEDDING_DIM=384
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    restart: unless-stopped
    mem_limit: 3.5g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kexp-network

  nginx:
    image: nginx:alpine
    container_name: kexp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kexp-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: kexp-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kexp-network:
    driver: bridge

volumes:
  nginx-logs:
