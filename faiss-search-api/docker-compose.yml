version: '3.8'

services:
  api:
    build: .
    container_name: kexp-search-api
    expose:
      - "8000"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    environment:
      - DATABASE_PATH=/app/data/music_kb.sqlite
      - EMBEDDINGS_PATH=/app/data/embeddings_256d.npy
      - PLAY_IDS_PATH=/app/data/play_ids.npy
      - PCA_PATH=/app/data/pca_transformer_256d.joblib
      - INDEX_PATH=/app/data/embeddings_256d.index
      - METADATA_PATH=/app/data/metadata.json
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
    restart: unless-stopped
    mem_limit: 3.5g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kexp-network

  nginx:
    image: nginx:alpine
    container_name: kexp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kexp-network

networks:
  kexp-network:
    driver: bridge

volumes:
  nginx-logs:
