name: FAISS API CI/CD

on:
  push:
    branches: [adjunct_new, main]
    paths:
      - "faiss-search-api/**"
      - ".github/workflows/faiss-api-ci.yml"
  pull_request:
    paths:
      - "faiss-search-api/**"
      - ".github/workflows/faiss-api-ci.yml"

env:
  PYTHON_VERSION: "3.12"
  WORKING_DIR: faiss-search-api

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.5"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linting
        run: |
          uv run ruff check app/ tests/
          uv run ruff format --check app/ tests/
        continue-on-error: true  # Don't fail on lint for now

      - name: Run unit tests
        run: |
          uv run pytest tests/test_search_service.py tests/test_db_service.py \
            -v --tb=short

      - name: Run API tests
        run: |
          uv run pytest tests/test_api.py -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./faiss-search-api
          file: ./faiss-search-api/Dockerfile
          push: false
          tags: faiss-search-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-and-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/adjunct_new'
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Get Droplet IP
        id: droplet
        run: |
          DROPLET_IP=$(doctl compute droplet get ubuntu-s-2vcpu-4gb-sfo3-01 --format PublicIPv4 --no-header)
          echo "ip=$DROPLET_IP" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ steps.droplet.outputs.ip }} >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          rsync -avzL --progress \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='data/*' \
            --exclude='.git' \
            --exclude='.coverage' \
            --exclude='nginx*.conf' \
            --exclude='certbot/' \
            --exclude='secrets/' \
            faiss-search-api/ root@${{ steps.droplet.outputs.ip }}:/root/faiss-search-api/

      - name: Rebuild and restart containers
        run: |
          ssh root@${{ steps.droplet.outputs.ip }} "
            cd /root/faiss-search-api && \
            docker-compose down && \
            docker-compose build --no-cache && \
            docker-compose up -d
          "

      - name: Wait for service startup
        run: sleep 45

      - name: Run deployment verification
        run: |
          chmod +x faiss-search-api/scripts/verify_deployment.sh
          ./faiss-search-api/scripts/verify_deployment.sh https://cratemusic.duckdns.org

      - name: Run post-deploy smoke tests
        run: |
          # Health check
          curl -sf https://cratemusic.duckdns.org/api/health | jq .

          # Search test
          curl -sf -X POST https://cratemusic.duckdns.org/api/search \
            -H "Content-Type: application/json" \
            -d '{"query": "seattle grunge", "limit": 3}' | jq '.total, .query_time_ms'

          # Plays endpoint
          curl -sf "https://cratemusic.duckdns.org/api/plays/1" | jq '.play_id'

          # Graph connections
          curl -sf -X POST https://cratemusic.duckdns.org/api/graph/connections \
            -H "Content-Type: application/json" \
            -d '{"query_type": "band_members", "mbids": ["a74b1b7f-71a5-4011-9441-d0b5e4122711"], "limit": 5}' | jq '.total'

          echo "All smoke tests passed!"

      - name: Notify on failure
        if: failure()
        run: echo "::error::FAISS API deployment verification failed!"
