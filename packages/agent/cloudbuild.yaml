steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/crate-agent:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/crate-agent:latest'
      - '-f'
      - 'packages/agent/Dockerfile'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/crate-agent:$BUILD_ID'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'crate-agent'
      - '--image'
      - 'gcr.io/$PROJECT_ID/crate-agent:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - '${_SERVICE_ACCOUNT_EMAIL}'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--concurrency'
      - '${_CONCURRENCY}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--set-env-vars'
      - 'FAISS_API_URL=${_FAISS_API_URL},FAISS_API_KEY=${_FAISS_API_KEY},PUBSUB_INVOKER_EMAIL=${_PUBSUB_INVOKER_EMAIL}'
      # Use Secret Manager for ANTHROPIC_API_KEY (create secret first: gcloud secrets create anthropic-api-key --data-file=-)
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest'
      - '--timeout'
      - '${_TIMEOUT}'

images:
  - 'gcr.io/$PROJECT_ID/crate-agent:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/crate-agent:latest'

substitutions:
  _FAISS_API_URL: 'https://cratemusic.duckdns.org'
  _FAISS_API_KEY: 'placeholder'  # Override with --substitutions flag
  # ANTHROPIC_API_KEY is now loaded from Secret Manager (see --set-secrets above)
  _REGION: 'us-west1'
  _SERVICE_ACCOUNT_EMAIL: '211636922435-compute@developer.gserviceaccount.com'
  _PUBSUB_INVOKER_EMAIL: 'pubsub-invoker@gen-lang-client-0874846742.iam.gserviceaccount.com'
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '8'
  _CONCURRENCY: '1'
  _CPU: '1'
  _MEMORY: '1536Mi'
  _TIMEOUT: '900s'
